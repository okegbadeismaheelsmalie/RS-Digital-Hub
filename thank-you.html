<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Project Request Received | RS Digital Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #172554 0%, #0f172a 45%, #020617 100%);
      color: #ffffff;
    }

    .thank-you-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .thank-you-card {
      width: 100%;
      max-width: 600px;
      padding: 40px 28px;
      text-align: center;

      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;

      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.45);
    }

    .thank-you-icon {
      font-size: 58px;
      margin-bottom: 12px;
    }

    .thank-you-title {
      margin: 0 0 14px;
      font-size: 32px;
      line-height: 1.2;
    }

    .thank-you-message {
      margin: 0 auto 28px;
      max-width: 480px;
      color: #cbd5e1;
      font-size: 16px;
      line-height: 1.7;
    }

    .code-box {
      margin: 25px 0;
      padding: 22px;

      background: rgba(2, 6, 23, 0.75);
      border: 1px dashed #38bdf8;
      border-radius: 15px;
    }

    .code-label {
      display: block;
      margin-bottom: 8px;

      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;

      color: #94a3b8;
    }

    .code-value {
      font-family: monospace;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #38bdf8;
    }

    .code-instruction {
      margin: 12px 0 0;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }

    .actions-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 150px;
      padding: 13px 20px;

      border-radius: 10px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;

      transition: 0.2s ease;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {
      .thank-you-wrapper {
        padding: 16px;
      }

      .thank-you-card {
        padding: 32px 20px;
      }

      .thank-you-title {
        font-size: 27px;
      }

      .code-value {
        font-size: 28px;
      }

      .actions-group {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="thank-you-wrapper">

    <section class="thank-you-card">

      <div class="thank-you-icon">
        🎉
      </div>

      <h1 class="thank-you-title">
        Project Request Received!
      </h1>

      <p class="thank-you-message">
        Your project request has been successfully submitted to
        <strong>RS Digital Hub</strong>.
        Our team will review your request and get back to you.
      </p>

      <div class="code-box">

        <span class="code-label">
          Your Project Code
        </span>

        <div
          id="projectCodeDisplay"
          class="code-value"
        >
          ---
        </div>

        <p class="code-instruction">
          Please save this code. You can use it when contacting
          RS Digital Hub about your project.
        </p>

      </div>

      <div class="actions-group">

        <a
          href="index.html"
          class="btn btn-primary"
        >
          Back to Home
        </a>

        <a
          href="index.html#contact"
          class="btn btn-secondary"
        >
          Contact Us
        </a>

      </div>

    </section>

  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const params = new URLSearchParams(
        window.location.search
      );

      const projectCode = params.get("project");

      const codeDisplay =
        document.getElementById("projectCodeDisplay");

      if (projectCode && projectCode.trim() !== "") {

        codeDisplay.textContent =
          projectCode.trim();

      } else {

        codeDisplay.textContent = "N/A";

      }

    });
  </script>

</body>
</html>
