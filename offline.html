<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | RS Digital Hub 👑</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/css/base.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0e17;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 24px;
      margin: 0;
    }
    .offline-card {
      max-width: 480px;
      background: #111827;
      border: 1px solid rgba(240, 196, 99, 0.2);
      border-radius: 16px;
      padding: 40px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .offline-icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      color: #f0c463;
      margin: 0 0 12px;
      font-weight: 700;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      background: #f0c463;
      color: #0a0e17;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background: #dfb250;
    }
  </style>
</head>
<body>
  <div class="offline-card" id="offlineCard">
    <div class="offline-icon">👑 📡</div>
    <h1>You're Currently Offline</h1>
    <p>
      RS Digital Hub requires an internet connection to securely communicate with Supabase, verify sessions, and track live project updates.
    </p>
    <button class="btn" id="retryBtn" onclick="window.location.reload()">
      Retry Connection 🔄
    </button>
  </div>
</body>
</html>
